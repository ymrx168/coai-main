name: Vite Build & Deploy
run-name: ${{ github.actor }} 正在自动构建Vite项目
on: [push]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 配置Node.js 20环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: 官方一键安装pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: 校验项目目录结构
        run: ls -la
      - name: 安装项目依赖
        run: pnpm install --no-frozen-lockfile
      - name: 执行全量类型校验与生产构建
        run: NODE_OPTIONS="--max-old-space-size=8192" pnpm run build
      - name: 上传Pages构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Vite Build & Deploy
run-name: ${{ github.actor }} 正在自动构建Vite项目
on: [push]
jobs:
  Build-and-Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v6
      - name: 配置Node.js 20环境并自动缓存pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: 全局安装pnpm包管理器
        run: npm install -g pnpm
      - name: 安装项目依赖
        run: pnpm install
      - name: 执行生产构建
        run: NODE_OPTIONS="--max-old-space-size=8192" pnpm run build

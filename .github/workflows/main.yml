name: Vite Build & Deploy 国内镜像优化版

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pre-check:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取最新仓库代码
        uses: actions/checkout@v4

      - name: 配置Node.js 20环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 全局安装pnpm 9
        run: npm install -g pnpm@9

      - name: 配置镜像 + 安装依赖
        run: |
          cd $GITHUB_WORKSPACE/app
          pnpm config set registry https://registry.npmmirror.com
          pnpm install --no-frozen-lockfile

  auto-fix-missing-deps:
    needs: pre-check
    runs-on: ubuntu-latest
    steps:
      - name: 拉取最新仓库代码
        uses: actions/checkout@v4

      - name: 配置Node.js 20环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 全局安装pnpm 9
        run: npm install -g pnpm@9

      - name: 修复依赖
        run: |
          cd $GITHUB_WORKSPACE/app
          pnpm install

  final-build-deploy:
    needs: auto-fix-missing-deps
    runs-on: ubuntu-latest
    steps:
      - name: 拉取最新仓库代码
        uses: actions/checkout@v4

      - name: 配置Node.js 20环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 全局安装pnpm 9
        run: npm install -g pnpm@9

      - name: 安装全量依赖
        run: |
          cd $GITHUB_WORKSPACE/app
          pnpm config set registry https://registry.npmmirror.com
          pnpm install --no-frozen-lockfile

      - name: 执行生产构建
        run: |
          cd $GITHUB_WORKSPACE/app
          NODE_OPTIONS="--max-old-space-size=8192" pnpm run build

      - name: 上传Pages构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app/dist

  deploy:
    needs: final-build-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
